# XcodeGen spec: CI generates HarvestBuddy.xcodeproj from this, so no .pbxproj is checked in.
name: HarvestBuddy
options:
  bundleIdPrefix: dk.cmaintz
  deploymentTarget:
    iOS: "17.0"
packages:
  HarvestBuddyKit:
    path: .
targets:
  HarvestBuddy:
    type: application
    platform: iOS
    sources: [App]
    scheme: {}
    dependencies:
      - package: HarvestBuddyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.cmaintz.harvestbuddy
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Harvest Buddy
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        # Debug talks to the web repo's dev server on the Mac running the simulator; Release to
        # the deployed Worker.
        Debug:
          API_BASE_URL: "http://localhost:5173"
        Release:
          API_BASE_URL: "https://harvestbuddy.cmaintz-site.workers.dev"
    info:
      path: App/Info.plist
      properties:
        APIBaseURL: $(API_BASE_URL)
        NSAppTransportSecurity:
          # Plain HTTP only to localhost, for the Debug build's dev server.
          NSAllowsLocalNetworking: true
